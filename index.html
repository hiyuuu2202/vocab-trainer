<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Vocabulary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>📘 Daily Vocabulary</h1>

  <div class="guide">
    <ul>
      <li>Nhập từ vựng trong ngày</li>
      <li>Học liên tục cho đến khi hết từ</li>
      <li>Mỗi từ phải đúng <b>3 lần</b> để biến mất</li>
      <li>Dạng bài tự trộn: điền khuyết & trắc nghiệm</li>
    </ul>
  </div>

  <div class="prompt-box">
    <h2>🤖 Prompt cho ChatGPT</h2>
    <textarea id="promptText" readonly>
Tôi sẽ đưa cho bạn một danh sách từ vựng tiếng Anh, mỗi từ trên một dòng.
Hãy trả về danh sách theo đúng định dạng sau:

word | nghĩa tiếng Việt ngắn gọn

Yêu cầu:
- Mỗi từ trên một dòng
- Không đánh số
- Không thêm giải thích
- Không thêm ký tự thừa
- Chỉ dùng dấu | để phân tách

Danh sách từ:
    </textarea>
    <button onclick="copyPrompt()">📋 Sao chép prompt</button>
  </div>

  <textarea id="vocabInput" placeholder="moon | mặt trăng"></textarea>

  <button class="primary full" onclick="saveAndStart()">Lưu & bắt đầu học</button>
  <button class="danger full" onclick="clearToday()">🗑️ Xóa từ hôm nay</button>
</div>

<script src="script.js"></script>
</body>
</html>
